# SPDX-License-Identifier: Apache-2.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - name: Build distributions
        env:
          SOURCE_DATE_EPOCH: "1724544000"
        run: python -m build --sdist --wheel
      - name: Verify tag matches package version
        run: python -c "from pathlib import Path; namespace = {}; exec(Path('src/meridian_storage/adapters/clickhouse/_version.py').read_text(), namespace); assert '${{ github.ref_name }}' == 'v' + namespace['__version__']"
      - run: python -m twine check dist/*
      - run: sha256sum dist/*.whl dist/*.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: SHA256SUMS

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: checksums
          path: dist
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes

  pypi:
    name: PyPI trusted publication
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/meridian-storage-clickhouse/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: true
